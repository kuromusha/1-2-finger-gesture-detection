<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1-2 Finger Gesture Detection</title>
</head>
<body>
  <h1>1-2 Finger Gesture Detection</h1>
  <p>data provider labels: <span id="labelsTxt">?</span></p>
  <button id="connectBtn" type="button">Connect</button>
  <button id="transferBtn" type="button" disabled>Model Transfer</button>
  <p id="statusEl" role="status" aria-live="polite">Click Connect</p>
  <p id="imuDataEl"></p>
  <script type="module">
    import * as api from "./api.js";
    const connectBtn = document.getElementById("connectBtn");
    const transferBtn = document.getElementById("transferBtn");
    const labelsTxt = document.getElementById("labelsTxt");
    const statusEl = document.getElementById("statusEl");
    const imuDataEl = document.getElementById("imuDataEl");
    const GESTURES = ["Right with 1 finger", "Right with 2 fingers", "Left with 1 finger", "Left with 2 fingers",
      "Up with 1 finger", "Up with 2 fingers", "Down with 1 finger", "Down with 2 fingers"];
    let busy = false;
    function updateButtons() {
      connectBtn.disabled = busy || !navigator.bluetooth;
      connectBtn.textContent = api.isConnected() ? "Disconnect" : "Connect";
      transferBtn.disabled = busy || !api.isConnected();
    }
    function showError(error) { statusEl.textContent = error.message || String(error); }
    if (!navigator.bluetooth) statusEl.textContent = "This browser does not support Web Bluetooth. Please use a supported browser over HTTPS.";
    updateButtons();

    api.addEventListener("disconnect", () => {
      labelsTxt.textContent = "?";
      imuDataEl.textContent = "";
      statusEl.textContent = "Disconnected. Click Connect to reconnect.";
      updateButtons();
    });
    api.addEventListener("error", showError);
    api.addEventListener("file-transfer-error", showError);

    connectBtn.addEventListener("click", async () => {
      busy = true;
      updateButtons();
      try {
        if (api.isConnected()) {
          await api.disconnect();
        } else {
          statusEl.textContent = "Connecting...";
          await api.connect();
          labelsTxt.textContent = await api.readDataProviderLabels();
          if (api.isConnected()) statusEl.textContent = "Connected! Arduino LED should now be blue.";
        }
      } catch (error) {
        showError(error);
      } finally {
        busy = false;
        updateButtons();
      }
    });

    transferBtn.addEventListener("click", async () => {
      busy = true;
      updateButtons();
      statusEl.textContent = "Transferring model...";
      try {
        await api.transferModel({model: "./static/model.tflite", numClasses: 8,
          threshold: 0.1, numSamples: 15, captureDelay: 200});
        statusEl.textContent = "Transfer successful!";
      } catch (error) {
        showError(error);
      } finally {
        busy = false;
        updateButtons();
      }
    });
    api.addEventListener("file-transfer-progress", progress => {
      statusEl.textContent = progress < 1 ? `Transferring! ${Math.floor(progress * 100)}%` : "Verifying transfer...";
    });
    api.addEventListener("inference", ({index, score, velocity}) => {
      if (!busy) statusEl.textContent = `Detected: ${GESTURES[index] || "Unknown gesture"} (score: ${score}, velocity: ${velocity})`;
    });
    api.addEventListener("imudata", data => {
      imuDataEl.textContent = "received data: " + [...data].map(value => value.toFixed(4)).join(",");
    });
  </script>
</body>
</html>
